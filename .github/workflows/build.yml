name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MiniLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiniLauncher.apk
          gh release create "v1.${{ github.run_number }}" MiniLauncher.apk \
            --title "Mini Launcher 1.${{ github.run_number }}" \
            --notes "Compilation automatique ${{ github.sha }}" \
            --latest
